name: Sentinel Security Scan

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  security-scan:
    name: Sentinel Vulnerability Scan & AI Hardening
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Sentinel
        run: pip install .

      - name: Run Sentinel Scan
        id: sentinel_scan
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          sentinel scan . \
            --ci \
            --fail-on high \
            --output-format markdown \
            --output-file sentinel-report.md

          sentinel scan . \
            --ci \
            --fail-on high \
            --output-format sarif \
            --output-file sentinel-report.sarif

      - name: Publish GitHub Step Summary
        if: always()
        shell: bash
        run: |
          if [ -f sentinel-report.md ]; then
            cat sentinel-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment PR with Sentinel Report
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('sentinel-report.md')) {
              const body = fs.readFileSync('sentinel-report.md', 'utf8');
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const botComment = comments.find(comment =>
                comment.body.includes('Sentinel Security Scan Report')
              );
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
            }

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sentinel-report.sarif
          category: sentinel
        continue-on-error: true

      - name: Check Scan Status
        if: steps.sentinel_scan.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::Sentinel detected security vulnerabilities matching or exceeding threshold."
          exit 1
